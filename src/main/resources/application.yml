server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: interview-prep-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

---
# ─── Default Profile (H2 In-Memory Database for fast testing & local dev) ──────
spring:
  config:
    activate:
      on-profile: default

  datasource:
    url: jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# ─── Docker Profile (PostgreSQL Database for production-like execution) ────────
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:interviewdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
